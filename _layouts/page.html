---
layout: base
---
<header class="page-head">
  <div class="container">
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.lead %}<p class="page-lead">{{ page.lead }}</p>{% endif %}
  </div>
</header>

<div class="container page-body">
  <article class="prose page-content">
    {%- if page.pub_list %}
    {%- comment %} Publications are plain Markdown; add the list, DOI and citation classes here {% endcomment %}
    {{ content | replace: '<ul>', '<ul class="pub-list">' | replace: '<a href="https://doi.org/', '<a class="doi" href="https://doi.org/' | replace: '<a href="https://scholar.google.com/scholar?cites=', '<a class="cite" href="https://scholar.google.com/scholar?cites=' }}
    {%- else %}
    {{ content }}
    {%- endif %}
  </article>
</div>
